<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>琳 · 待机动作预览</title>
<style>body{margin:0;background:#202733;color:#fff;font:16px system-ui}header{position:absolute;top:20px;left:24px}h1{margin:0}button{padding:10px 24px}footer{position:absolute;bottom:24px;left:24px}canvas{display:block}</style>
<header><h1>琳 · 待机动作</h1><p>原模型与动作 · 颜色参考材质</p><p id="status">加载中</p></header><footer><button id="pause" disabled>暂停</button> 拖动旋转 · 滚轮缩放</footer>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as T from 'three';import {GLTFLoader} from './vendor/loaders/GLTFLoader.js';import {OrbitControls} from './vendor/controls/OrbitControls.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x202733);document.body.prepend(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,200);camera.position.set(-26,9,14);const control=new OrbitControls(camera,renderer.domElement);control.target.set(1,7,0);control.update();
const clock=new T.Clock();let mixer,paused=false;const status=document.querySelector('#status'),button=document.querySelector('#pause');
try{const asset=await new GLTFLoader().loadAsync('./lynn-idle.glb');scene.add(asset.scene);mixer=new T.AnimationMixer(asset.scene);mixer.clipAction(asset.animations[0]).play();button.disabled=false;status.textContent='待机动作播放中';button.onclick=()=>{paused=!paused;button.textContent=paused?'播放':'暂停';status.textContent=paused?'已暂停':'待机动作播放中';};}catch(e){status.textContent='加载失败：'+e.message;console.error(e);}
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer&&!paused)mixer.update(Math.min(dt,.1));renderer.render(scene,camera);});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
