<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>黑潮之上 · 大厅场景</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171923;color:#fff;font:14px system-ui}canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scaleX(-1)}nav{position:absolute;bottom:24px;left:24px;display:flex;gap:12px}button,a{color:#fff;background:#222a37cc;border:1px solid #ffffff55;border-radius:5px;padding:10px 18px;text-decoration:none;cursor:pointer}#status{position:absolute;top:20px;left:24px;background:#15192299;padding:10px}select{max-width:180px}</style>
<div id="status">大厅载入中…</div><nav><button id="character">不知火</button><button id="home">大厅视角</button><button id="up">楼上</button><button id="down">地下</button><a href="../?apiPort=7460">返回试玩</a></nav>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as T from 'three';import {GLTFLoader} from './vendor/loaders/GLTFLoader.js';import {OrbitControls} from './vendor/controls/OrbitControls.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x171923);document.body.prepend(renderer.domElement);
const world=new T.Scene(),camera=new T.PerspectiveCamera(18,innerWidth/innerHeight,.1,20000),controls=new OrbitControls(camera,renderer.domElement);let cameras=[],mixers=[];const clock=new T.Clock();function resize(){const w=Math.min(innerWidth,innerHeight*16/9);renderer.setSize(w,w*9/16);camera.aspect=16/9;camera.updateProjectionMatrix();}resize();
function view(name){const row=cameras.find(r=>r.Name===name);if(!row)throw Error('场景镜头缺失：'+name);new T.Matrix4().fromArray(row.Transform.split(',').map(Number)).decompose(camera.position,camera.quaternion,camera.scale);camera.scale.set(1,1,1);camera.rotateY(Math.PI);camera.fov=Number(row.Fov);camera.near=Number(row.Near);camera.far=Number(row.Far);camera.updateProjectionMatrix();controls.target.copy(camera.position).add(camera.getWorldDirection(new T.Vector3()).multiplyScalar(70));controls.update();}
try{const asset=await new GLTFLoader().loadAsync('./hall.glb');asset.scene.traverse(n=>{if(n.userData.sourceInstance?.FilePathIndex==='25')n.visible=false;if(n.isMesh){const materials=Array.isArray(n.material)?n.material:[n.material];for(const m of materials){if(m.userData.sourceMaterialXML?.includes('CullMode="2"'))m.side=T.FrontSide;if(m.map){m.map.anisotropy=renderer.capabilities.getMaxAnisotropy();m.map.needsUpdate=true;}}}});world.add(asset.scene);const actor=await new GLTFLoader().loadAsync('./shiranui.glb');const placement=new T.Group();placement.name='ShiranuiHallPreview';const marker=asset.scene.children.find(n=>n.userData.sourceInstance?.Name==='player_position');if(!marker)throw Error('原站位标记缺失');placement.position.copy(marker.position);placement.quaternion.copy(marker.quaternion);placement.scale.setScalar(.86);placement.add(actor.scene);world.add(placement);actor.scene.traverse(n=>{if(n.isMesh){for(const m of Array.isArray(n.material)?n.material:[n.material]){if(m.map){m.map.anisotropy=renderer.capabilities.getMaxAnisotropy();m.map.needsUpdate=true;}}}});const mixer=new T.AnimationMixer(actor.scene);mixers.push(mixer);const idle=actor.animations.find(a=>a.name==='home_stand_idle_1');if(!idle)throw Error('原大厅待机缺失');mixer.clipAction(idle).play();const weapon=await new GLTFLoader().loadAsync('./shiranui-weapon.glb');placement.add(weapon.scene);const weaponIdle=weapon.animations.find(a=>a.name==='home_stand_idle_1');if(!weaponIdle)throw Error('原扇子待机缺失');const weaponMixer=new T.AnimationMixer(weapon.scene);weaponMixer.clipAction(weaponIdle).play();mixers.push(weaponMixer);document.querySelector('#character').onclick=()=>{view('camera_1');for(const mixer of mixers)mixer.update(0);world.updateMatrixWorld(true);const center=new T.Box3().setFromObject(placement).getCenter(new T.Vector3());const forward=camera.getWorldDirection(new T.Vector3());camera.position.copy(center).addScaledVector(forward,-60);camera.fov=18;camera.updateProjectionMatrix();controls.target.copy(center);controls.update();};cameras=asset.parser.json.extras.sourceCameras;view('camera_1');document.querySelector('#status').textContent='主角家 · 不知火';document.querySelector('#home').onclick=()=>view('camera_1');document.querySelector('#up').onclick=()=>view('camera_upstairs');document.querySelector('#down').onclick=()=>view('camera_negative');world.updateMatrixWorld(true);const ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(),camera);console.info('Hall center surfaces',JSON.stringify(ray.intersectObjects(world.children,true).slice(0,8).map(h=>({name:h.object.name,distance:h.distance,source:h.object.parent.userData.sourceInstance??h.object.userData.sourceInstance}))));}catch(error){document.querySelector('#status').textContent='载入失败：'+error.message;console.error(error);}
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.1);for(const mixer of mixers)mixer.update(dt);renderer.render(world,camera);});addEventListener('resize',resize);
</script></html>
